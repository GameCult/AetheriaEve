name: Aetheria portable architecture boundaries

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  static-contract:
    name: ${{ matrix.os }} boundary and conformance shape
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out AetheriaEve
        uses: actions/checkout@v4
        with:
          path: AetheriaEve

      - name: Check out CultLib
        uses: actions/checkout@v4
        with:
          repository: GameCult/CultLib
          ref: codex/cultmesh-explicit-document-writes
          path: CultLib

      - name: Check out Eve
        uses: actions/checkout@v4
        with:
          repository: GameCult/Eve
          ref: codex/eve-browser-host-isolation
          path: Eve

      - name: Check out EvePlugins
        uses: actions/checkout@v4
        with:
          repository: GameCult/EvePlugins
          path: EvePlugins

      - name: Check out CultMath
        uses: actions/checkout@v4
        with:
          repository: GameCult/CultMath
          path: CultMath

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reject duplicate or client-owned authority paths
        shell: pwsh
        working-directory: AetheriaEve
        run: ./scripts/verify-portable-game-framework.ps1

      - name: Verify the static Eve contract pack
        working-directory: AetheriaEve
        run: node scripts/verify-eve-conformance-pack.mjs

      - name: Install isolated wire-witness dependencies
        working-directory: AetheriaEve/Aetheria.Rts.Web/wire
        run: npm ci

      - name: Verify C# and TypeScript MessagePack interoperability
        working-directory: AetheriaEve/Aetheria.Rts.Web
        run: node scripts/verify-rts-wire-interop.mjs
